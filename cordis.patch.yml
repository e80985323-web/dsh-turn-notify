# ============================================================================
# dsh-turn-notify —— DSH bundle patch
# ============================================================================
# 这是插件的「挂载声明」。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把「每轮回复结束 → 右下角通知」插入 Web profile 的配置树。
#
# 安装方式：
#   dsh plugin --profile web add link:<本目录绝对路径>
# 卸载：删掉这一行 insert 行 + profile package.json 里的依赖与 bundles 项。
# ============================================================================

- insert:
    - id: dsh-turn-notify
      name: dsh-turn-notify
